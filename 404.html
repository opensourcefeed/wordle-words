---
permalink: /404.html
layout: default
title: Page not found
sitemap: false
---

<div class="intro not-found">
  <h1 id="checker-title">Page not found</h1>
  <p id="checker-result" class="result" aria-live="polite">The page you asked for doesn't exist.</p>
  <div id="checker-suggest"></div>

  <form class="checker" role="search" data-checker data-from-path
    data-words="{{ '/assets/words.json' | relative_url }}" data-base="{{ '/word/' | relative_url }}">
    <label for="checker-input" class="visually-hidden">Check a word</label>
    <input id="checker-input" class="form-control" type="text" maxlength="15" autocomplete="off"
      placeholder="Is it a Wordle word?" autocapitalize="none" spellcheck="false">
    <button class="btn btn-primary" type="submit">Check</button>
  </form>

  <p><a href="{{ '/' | relative_url }}">Check a word</a> · <a href="{{ '/browse/' | relative_url }}">Browse all Wordle words</a></p>
</div>

<script src="{{ '/assets/checker.js' | relative_url }}" defer></script>
