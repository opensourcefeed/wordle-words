{%- assign nav = "/browse/|Browse A–Z,/past-answers/|Past answers,/possible-answers/|Possible answers" | split: "," -%}
<header class="site-header">
    <nav class="container nav-inner" aria-label="Main">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">{% include logo.svg %}Wordle Words</a>
        <ul class="nav-links">
            {%- for item in nav %}{% assign parts = item | split: "|" %}
            <li><a href="{{ parts[0] | relative_url }}"{% if page.url == parts[0] %} aria-current="page"{% endif %}>{{ parts[1] }}</a></li>
            {%- endfor %}
            <li><a href="/puzzles/wordle-solver/">Solver</a></li>
            <li><a href="/puzzles/">Play puzzles</a></li>
        </ul>
    </nav>
</header>
