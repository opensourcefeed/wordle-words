---
layout: default
---
{%- assign home = '/' | relative_url -%}
<div class="hub-page">
<nav class="crumbs" aria-label="Breadcrumb">
    <a href="{{ home }}">All Wordle Words</a>
    {% for c in page.crumbs %}<span aria-hidden="true">›</span> <a href="{{ c.url | relative_url }}">{{ c.name }}</a>
    {% endfor %}<span aria-hidden="true">›</span> <span aria-current="page">{{ page.short }}</span>
</nav>

<article class="hub">
    <h1>{{ page.title }}</h1>
    {%- if page.filter %}
    <div class="list-filter">
        <form role="search" data-list-filter data-base="{{ '/word/' | relative_url }}">
            <label for="list-filter-input" class="visually-hidden">Find a word on this page</label>
            <input id="list-filter-input" class="form-control" type="search" maxlength="5" autocomplete="off"
                placeholder="Find a word on this page" autocapitalize="none" spellcheck="false" enterkeyhint="go">
            <button class="btn btn-primary" type="submit">Go</button>
        </form>
        <p class="filter-status" aria-live="polite"></p>
    </div>
    {%- endif %}
    {{ content }}
    <div class="text-center back-link">
        <a class="btn btn-primary" href="{{ '/browse/' | relative_url }}">Browse all word lists</a>
    </div>
</article>
</div>

{% if page.filter %}<script src="{{ '/assets/list-filter.js' | relative_url }}" defer></script>{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "All Wordle Words", "item": {{ '/' | absolute_url | jsonify }}}
    {%- for c in page.crumbs %},
    {"@type": "ListItem", "position": {{ forloop.index | plus: 1 }}, "name": {{ c.name | jsonify }}, "item": {{ c.url | absolute_url | jsonify }}}
    {%- endfor %},
    {"@type": "ListItem", "position": {{ page.crumbs.size | plus: 2 }}, "name": {{ page.short | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]
}
</script>
