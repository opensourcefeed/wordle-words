<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.head_title %}{{ page.head_title }}{% else %}{{ page.title }} | All Wordle Words{% endif %}</title>
    {% if page.sensitive or page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
    {% seo title=false %}
    {%- include_cached head-icons.html %}
    {% include_cached inline-css.html %}
</head>

<body>
    {% include header.html %}
    <main class="container">
        {{ content }}
    </main>
    {% include footer.html %}
    {% include tracking.html %}
</body>

</html>
